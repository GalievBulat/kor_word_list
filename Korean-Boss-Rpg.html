// Формулы:
// weakest:  Только База                    → "Слизь"
// weak:     Мод + База                     → "Поганая Крыса"
// lesser:   Мод + База                     → "Хитрый Кобольд"
// mid:      Мод + База                     → "Кровавый Скелет"
// greater:  Мод + База                     → "Лютый Вервульф"
// strong:   Мод + База, Титул              → "Адский Палач, Хаоса"
// elite:    Мод + База, Титул              → "Падший Рыцарь смерти, Бездны"
// champion: Мод + База, Титул              → "Ужасающий Архидемон, Тысячи Душ"
// boss:     Мод + База, Титул              → "Нерушимый Владыка, Вечности"
const RANK_FORMULA = {
  weakest:  "base",
  weak:     "mod_base",
  lesser:   "mod_base",
  mid:      "mod_base",
  greater:  "mod_base",
  strong:   "mod_base_title",
  elite:    "mod_base_title",
  champion: "mod_base_title",
  boss:     "mod_base_title"
};

// ── Иконки монстров по рангу (случайная из набора) ──
const RANK_EMOJI = {
  weakest:  ["🟢","🦠","🪱"],
  weak:     ["🐀","🐁","🦇","🦟"],
  lesser:   ["👺","👹","🧌"],
  mid:      ["🧟","🧟‍♂️","🧟‍♀️","👻"],
  greater:  ["🐺","🐗","🦍","🐻"],
  strong:   ["👹","🧛","🦹","🧙‍♂️"],
  elite:    ["⚔️","🛡️","🏴","⚰️"],
  champion: ["👿","🔮","💥","🌋"],
  boss:     ["👑","🐲","☠️","😈","💀"]
};

const randomItem = (arr) => arr[Math.floor(Math.random() * arr.length)];

/**
 * @param {string} rank
 * @returns {string} эмодзи
 */
const generateMonsterIcon = (rank = "weakest") => {
  const icons = RANK_EMOJI[rank] || RANK_EMOJI.weakest;
  return randomItem(icons);
};

/**
 * @param {string} rank
 * @returns {string}
 */
const generateMonsterName = (rank = "weakest") => {
  const pool = MONSTER_POOL[rank] || MONSTER_POOL.weakest;
  const base     = randomItem(pool.names);
  const modifier = pool.mods.length   ? randomItem(pool.mods)   : "";
  const title    = pool.titles.length ? randomItem(pool.titles) : "";
  //todo - чемпионы
  const formula  = RANK_FORMULA[rank] || "base";

  switch (formula) {
    case "base":
      return base;
    case "mod_base":
      return modifier ? `${modifier} ${base}` : base;
    case "mod_base_title":
    default:
      if (modifier && title) return `${modifier} ${base}, ${title}`;
      if (modifier)          return `${modifier} ${base}`;
      if (title)             return `${base}, ${title}`;
      return base;
  }
};

const rankFromIdx = (P) => {
  if (P < 9) return "weakest";   // 0–8 киллов
  if (P < 29) return "weak";      // 9–26
  if (P < 49) return "lesser";    // 27–49
  if (P < 69) return "mid";       // 50–74
  if (P < 99) return "greater";   // 75–99
  if (P < 129) return "strong";    // 100–124
  if (P < 149) return "elite";     // 125–146
  return "champion";// 166+
};
let koreanVoice = null;
const speakKorean = (text) => {
  if (typeof window === "undefined" || !("speechSynthesis" in window)) return;
  if (!text) return;

  const synth = window.speechSynthesis;
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = "ko-KR";
  utterance.rate = 0.9;
  utterance.pitch = 1;
  if (koreanVoice) utterance.voice = koreanVoice;
  if (synth.speaking || synth.pending) synth.cancel();
  synth.speak(utterance);
};
